name: keepalive-supabase

# Mantém o projeto Supabase ativo — o plano free pausa após ~7 dias sem requisições.
# Roda a cada 3 dias e também pode ser disparado manualmente na aba Actions.

on:
  schedule:
    - cron: '23 10 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          URL="https://vnlaxudshuzmwnvoyybv.supabase.co/rest/v1/lotes?select=id&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZubGF4dWRzaHV6bXdudm95eWJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NjI1NDAsImV4cCI6MjEwNjIzODU0MH0.FnMsGXqM7ylhohJpAYzWhPqtw0IQZ2Pu0zFbiefmEjU"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" -H "apikey: $KEY")
          echo "HTTP $CODE"
          case "$CODE" in
            2*) echo "Projeto ativo." ;;
            *) echo "Resposta inesperada ($CODE) — verifique o projeto no dashboard do Supabase."; exit 1 ;;
          esac
