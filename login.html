<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrdenhaDigital — Entrar</title>
<link rel="icon" href="icone-gm.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ---------- abertura: logo entra, flutua com ondas por 5 s, para, boas-vindas, login ---------- */
.abertura{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 46%, var(--accent-soft) 0%, var(--bg) 58%)}
.abertura.sai{animation:ab-sai .8s cubic-bezier(.7,0,.3,1) forwards}
.ab-palco{position:relative;display:flex;flex-direction:column;align-items:center;gap:min(22px,2.5vh);padding:0 16px}
.ab-logo{position:relative;width:min(300px,62vw,38vh);aspect-ratio:1;display:grid;place-items:center}
.ab-logo img{width:100%;height:auto;position:relative;z-index:2;filter:drop-shadow(0 18px 30px rgba(0,120,180,.28));
  animation:ab-nasce .8s cubic-bezier(.2,1.3,.4,1) 1.5s both, ab-pula 1.3s ease-in-out 2.6s both}
.ab-logo.parou img{animation:none}
/* ondas (como uma gota de leite caindo) */
.ab-gota{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;z-index:3;animation:ab-cai 1.5s cubic-bezier(.45,.05,.7,.7) both}
/* gota: quadrado com três cantos redondos e um pontudo, girado para a ponta ficar em cima */
.ab-gota::after{content:"";position:absolute;inset:0;border-radius:0 50% 50% 50%;transform:rotate(45deg);
  background:radial-gradient(circle at 60% 60%, #ffffff 0%, #f5f2ea 50%, #d9d2c2 100%);box-shadow:0 6px 16px rgba(0,0,0,.28)}
.ab-pingo{position:absolute;left:50%;top:50%;width:var(--t);height:var(--t);margin:calc(var(--t) / -2) 0 0 calc(var(--t) / -2);border-radius:50%;z-index:3;
  background:#faf8f2;box-shadow:0 2px 6px rgba(0,0,0,.2);opacity:0;animation:ab-espirra 1s cubic-bezier(.25,.6,.4,1) 1.5s both}
.ab-texto{width:min(420px,80vw,55vh);height:auto;opacity:0;transform:translateY(14px)}
.ab-boas{text-align:center;opacity:0;transform:translateY(14px)}
.ab-boas h1{font-size:clamp(1.1rem,min(4.6vw,5vh),2.3rem);font-stretch:115%;font-weight:800;color:var(--ink)}
.ab-boas p{margin:6px 0 0;color:var(--muted);font-size:1rem}
.ab-mostra{animation:ab-sobe .7s cubic-bezier(.2,.8,.2,1) forwards}
.ab-pular{position:absolute;right:max(16px, env(safe-area-inset-right));bottom:max(16px, env(safe-area-inset-bottom));background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:.82rem;cursor:pointer}
.ab-pular:hover{color:var(--ink);border-color:var(--muted)}
.login-wrap{opacity:1;transition:opacity .6s ease}
.login-wrap.escondido{opacity:0}

@keyframes ab-cai{0%{transform:translateY(-70vh) scaleY(1.1);opacity:0}8%{opacity:1}90%{transform:translateY(0) scaleY(1.1);opacity:1}100%{transform:translateY(5px) scale(1.35,.55);opacity:0}}
@keyframes ab-espirra{0%{transform:translate(0,0) scale(.4);opacity:0}8%{opacity:1}55%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
@keyframes ab-nasce{0%{transform:scale(0);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ab-pula{0%{transform:translateY(0) scale(1,1)}10%{transform:translateY(0) scale(1.05,.95)}30%{transform:translateY(-30px) scale(.98,1.02)}48%{transform:translateY(0) scale(1.04,.96)}56%{transform:translateY(0) scale(1,1)}72%{transform:translateY(-14px) scale(.99,1.01)}88%{transform:translateY(0) scale(1.02,.98)}100%{transform:translateY(0) scale(1,1)}}
@keyframes ab-sobe{to{opacity:1;transform:translateY(0)}}
@keyframes ab-sai{to{opacity:0;transform:translateY(-6vh) scale(1.04)}}
@media (prefers-reduced-motion:reduce){
  .ab-logo img,.ab-logo.parou img{animation:none}.ab-gota,.ab-pingo{display:none}.ab-mostra{animation:none;opacity:1;transform:none}.abertura.sai{animation:none;opacity:0}
}
</style>
</head>
<body>
<div class="abertura" id="abertura" hidden aria-label="Abertura do sistema">
  <div class="ab-palco">
    <div class="ab-logo" id="abLogo"><span class="ab-gota"></span>
      <span class="ab-pingo" style="--t:8px;--x:-55px;--y:-38px"></span><span class="ab-pingo" style="--t:6px;--x:-32px;--y:-62px"></span>
      <span class="ab-pingo" style="--t:9px;--x:52px;--y:-42px"></span><span class="ab-pingo" style="--t:6px;--x:30px;--y:-66px"></span>
      <span class="ab-pingo" style="--t:7px;--x:-70px;--y:4px"></span><span class="ab-pingo" style="--t:7px;--x:68px;--y:2px"></span>
      <img src="logo-simbolo.png" alt="GM Agronegócios"></div>
    <img class="ab-texto" id="abTexto" src="logo-texto.png" alt="">
    <div class="ab-boas" id="abBoas"><h1>Boas-vindas ao OrdenhaDigital</h1><p>Controle do rebanho leiteiro</p></div>
  </div>
  <button class="ab-pular" id="abPular" type="button">Pular</button>
</div>

<div class="login-wrap" id="loginWrap">
  <form class="login-card form" id="flogin" style="display:flex" novalidate>
    <img src="logo-gm.png" alt="GM Agronegócios">
    <h1>OrdenhaDigital</h1>
    <p>Controle do rebanho leiteiro</p>
    <div class="err" id="msg" hidden></div>
    <label>E-mail<input type="email" id="email" autocomplete="username" required></label>
    <label>Senha<input type="password" id="senha" autocomplete="current-password" required></label>
    <button class="btn pri" id="btnLogin" type="submit">Entrar</button>
  </form>
</div>
<script src="supabase-config.js"></script>
<script>
(function () { let t = null; try { t = localStorage.getItem('ordenha-tema'); } catch (e) {} document.documentElement.setAttribute('data-theme', t || 'dark'); })();
const msg = t => { const el = document.getElementById('msg'); el.textContent = t; el.hidden = !t; };
document.getElementById('flogin').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim(), senha = document.getElementById('senha').value, btn = document.getElementById('btnLogin');
  if (!email || !senha) { msg('Preencha e-mail e senha.'); return; }
  btn.disabled = true; btn.textContent = 'Entrando…'; msg('');
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });
  if (error) { msg('E-mail ou senha incorretos.'); btn.disabled = false; btn.textContent = 'Entrar'; return; }
  location.href = 'painel.html';
});

// ---------- abertura ----------
const sessaoPromessa = supabaseClient.auth.getSession().then(r => r.data.session).catch(() => null);
let jaViu = false; try { jaViu = sessionStorage.getItem('ordenha-abertura') === '1'; } catch (e) {}
const semMovimento = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ab = document.getElementById('abertura'), wrap = document.getElementById('loginWrap');
let timers = [], terminou = false;

async function depoisDaAbertura() {
  if (terminou) return; terminou = true;
  timers.forEach(clearTimeout);
  try { sessionStorage.setItem('ordenha-abertura', '1'); } catch (e) {}
  if (await sessaoPromessa) { location.href = 'painel.html'; return; }   // já logado: vai direto para o painel
  ab.classList.add('sai'); wrap.classList.remove('escondido');
  setTimeout(() => { ab.hidden = true; document.getElementById('email').focus(); }, semMovimento ? 0 : 800);
}
// Sem login: a abertura roda toda vez que a página carrega (inclusive ao atualizar).
// Já logado: roda uma vez por visita e segue para o painel.
if (!jaViu) iniciarAbertura();
else {
  wrap.classList.add('escondido');
  sessaoPromessa.then(s => { if (s) location.href = 'painel.html'; else iniciarAbertura(); });
}
function iniciarAbertura() {
  ab.hidden = false; wrap.classList.add('escondido');
  const T = semMovimento ? { para: 200, boas: 400, fim: 1800 } : { para: 5000, boas: 5300, fim: 7300 };
  timers.push(setTimeout(() => document.getElementById('abLogo').classList.add('parou'), T.para));          // logo para de se mexer aos 5 s
  timers.push(setTimeout(() => document.getElementById('abTexto').classList.add('ab-mostra'), T.para));     // aparece o nome da empresa
  timers.push(setTimeout(() => document.getElementById('abBoas').classList.add('ab-mostra'), T.boas));      // boas-vindas
  timers.push(setTimeout(depoisDaAbertura, T.fim));                                                         // 2 s depois, login
  ab.addEventListener('click', depoisDaAbertura);
  document.addEventListener('keydown', e => { if (!terminou && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) depoisDaAbertura(); });
}
</script>
</body>
</html>
